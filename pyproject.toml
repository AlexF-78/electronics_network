[project]
name = "electronics-network"
version = "0.1.0"
description = "Electronics retail network platform"
authors = [
    {name = "алексей федулов",email = "fab-78@mail.ru"}
]
readme = "README.md"
requires-python = "^3.13,<4.0"
dependencies = [
    "django-filter (>=25.2,<26.0)",
    "django (>=6.0.2,<7.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "isort (>=8.0.0,<9.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^26.1.0"
flake8 = "^7.3.0"
pytest = "^9.0.2"
pytest-django = "^4.12.0"
pre-commit = "^4.5.1"
